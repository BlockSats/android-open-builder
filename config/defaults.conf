# Project-controlled defaults. User overrides belong in ~/.config/android-open-builder/config.conf.
AOB_PROJECT_VERSION="0.1.0-dev"
AOB_DEFAULT_BUILDER="retroarch"
AOB_DATA_DIR="${HOME}/.local/share/android-open-builder"
AOB_CACHE_DIR="${HOME}/.cache/android-open-builder"
AOB_CONFIG_DIR="${HOME}/.config/android-open-builder"
AOB_WORK_DIR="${AOB_DATA_DIR}/work"
AOB_LOG_DIR="${AOB_DATA_DIR}/logs"
AOB_OUTPUT_DIR="${AOB_DATA_DIR}/output"
AOB_DOWNLOAD_DIR="${AOB_CACHE_DIR}/downloads"
AOB_ANDROID_SDK_ROOT="${AOB_DATA_DIR}/android-sdk"
AOB_MIN_DISK_GIB="20"
AOB_MIN_RAM_MIB="4096"
AOB_MIN_SWAP_MIB="2048"
AOB_BUILD_JOBS="auto"
