name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          find . -type f \( -name '*.sh' -o -path './aob' \) -print0 | while IFS= read -r -d '' file; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck -x aob menu.sh lib/*.sh scripts/*.sh builders/*/*.sh tests/*.sh

      - name: Run tests
        run: bash tests/run.sh
