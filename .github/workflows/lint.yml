name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          find . -type f \( -name '*.sh' -o -path './aob' \) -print0 | while IFS= read -r -d '' file; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        id: shellcheck
        continue-on-error: true
        run: shellcheck aob menu.sh lib/*.sh scripts/*.sh builders/*/*.sh tests/*.sh > shellcheck.log 2>&1

      - name: Upload ShellCheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-report
          path: shellcheck.log
          retention-days: 1

      - name: Run tests
        run: bash tests/run.sh

      - name: Enforce ShellCheck result
        if: steps.shellcheck.outcome == 'failure'
        run: |
          cat shellcheck.log
          exit 1
